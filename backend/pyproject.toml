[project]
name = "jlauncheros-backend"
version = "1.0.0-alpha"
description = "JARVIS Core Daemon for JLauncherOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psutil>=5.9.8",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
