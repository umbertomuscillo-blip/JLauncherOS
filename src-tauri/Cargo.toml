[package]
name = "jlauncheros"
version = "1.0.0"
description = "JLauncherOS — clone nativo di LaunchMe 2.0 per macOS (Apple Silicon)"
edition = "2021"

[lib]
name = "jlauncheros_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rayon = "1"
plist = "1"
icns = "0.5"
png = "0.17"
walkdir = "2"
dirs = "7"
libloading = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWorkspace", "NSScreen", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSApplication", "NSPasteboard", "NSPasteboardItem", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "NSData", "NSGeometry", "NSDictionary", "block2"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
